<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Trưa nay ăn gì?</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@500;700&family=Zen+Kaku+Gothic+New:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  :root{
    --bg-0:#11162A;
    --bg-1:#171E38;
    --bg-2:#1E2748;
    --paper:#F6F1E4;
    --paper-dim:#E8E0CB;
    --ink:#221A12;
    --text:#F1EEE2;
    --text-dim:#9098BE;
    --vermillion:#C1440E;
    --vermillion-bright:#E5581B;
    --gold:#D9A62E;

    --c-common:#3E56A8;
    --c-uncommon:#5B8A44;
    --c-rare:#CE7FA3;
    --c-epic:#7C57AD;
    --c-legendary:#D9A62E;

    --font-display:'Shippori Mincho', serif;
    --font-body:'Zen Kaku Gothic New', sans-serif;
  }

  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:
      radial-gradient(ellipse at 20% -10%, #22305F 0%, transparent 55%),
      radial-gradient(ellipse at 90% 10%, #2A1F44 0%, transparent 50%),
      var(--bg-0);
    color:var(--text);
    font-family:var(--font-body);
    min-height:100vh;
    overflow-x:hidden;
  }

  /* faint wave / seigaiha texture in the background */
  body::before{
    content:"";
    position:fixed; inset:0;
    background-image:radial-gradient(circle at 1px 1px, rgba(255,255,255,0.045) 1.4px, transparent 1.4px);
    background-size:26px 26px;
    pointer-events:none;
    z-index:0;
  }

  .wrap{
    position:relative;
    z-index:1;
    max-width:920px;
    margin:0 auto;
    padding:48px 20px 80px;
  }

  header{
    text-align:center;
    margin-bottom:40px;
  }
  .eyebrow-line{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:14px;
    color:var(--text-dim);
    font-size:13px;
    letter-spacing:0.04em;
    margin-bottom:14px;
  }
  .eyebrow-line span.bar{
    width:34px;height:1px;background:var(--text-dim);opacity:0.5;
  }
  h1{
    font-family:var(--font-display);
    font-weight:700;
    font-size:clamp(34px, 6vw, 56px);
    margin:0 0 12px;
    color:var(--text);
    line-height:1.15;
  }
  h1 em{
    font-style:normal;
    color:var(--vermillion-bright);
  }
  header p{
    color:var(--text-dim);
    font-size:15.5px;
    max-width:480px;
    margin:0 auto;
    line-height:1.6;
  }

  /* ---------- Reel ---------- */
  .reel-block{
    margin:0 auto 28px;
    max-width:760px;
  }

  .reel-frame{
    position:relative;
    padding:22px;
    background:linear-gradient(180deg, var(--bg-2), var(--bg-1));
    border:1px solid rgba(255,255,255,0.07);
    border-radius:6px;
    box-shadow:0 30px 60px -20px rgba(0,0,0,0.6), inset 0 1px 0 rgba(255,255,255,0.05);
  }

  .reel-frame .corner{
    position:absolute;
    width:22px;height:22px;
    border:2px solid var(--vermillion);
    opacity:0.85;
  }
  .corner.tl{top:-1px;left:-1px;border-right:none;border-bottom:none;}
  .corner.tr{top:-1px;right:-1px;border-left:none;border-bottom:none;}
  .corner.bl{bottom:-1px;left:-1px;border-right:none;border-top:none;}
  .corner.br{bottom:-1px;right:-1px;border-left:none;border-top:none;}

  .reel-viewport{
    position:relative;
    height:172px;
    overflow:hidden;
    background:var(--bg-0);
    border-radius:3px;
    mask-image:linear-gradient(90deg, transparent 0%, black 12%, black 88%, transparent 100%);
    -webkit-mask-image:linear-gradient(90deg, transparent 0%, black 12%, black 88%, transparent 100%);
  }

  .marker{
    position:absolute;
    left:50%;
    top:0; bottom:0;
    width:2px;
    background:var(--vermillion-bright);
    transform:translateX(-50%);
    z-index:5;
    box-shadow:0 0 14px 2px rgba(229,88,27,0.7);
  }
  .marker::before, .marker::after{
    content:"";
    position:absolute;
    left:50%;
    transform:translateX(-50%);
    width:0;height:0;
    border-left:7px solid transparent;
    border-right:7px solid transparent;
  }
  .marker::before{ top:-1px; border-top:9px solid var(--vermillion-bright); }
  .marker::after{ bottom:-1px; border-bottom:9px solid var(--vermillion-bright); }

  .reel-track{
    position:absolute;
    top:12px; bottom:12px; left:0;
    display:flex;
    gap:12px;
    will-change:transform;
    filter:none;
  }
  .reel-track.blurring{ filter:blur(1.5px); }

  .reel-card{
    flex:0 0 auto;
    width:132px;
    height:100%;
    border-radius:4px;
    background:var(--bg-2);
    border:1px solid rgba(255,255,255,0.06);
    border-top:3px solid var(--tier-color, var(--c-common));
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:8px;
    padding:8px;
    text-align:center;
    position:relative;
    overflow:hidden;
  }
  .reel-card::after{
    content:"";
    position:absolute; inset:0;
    background:linear-gradient(180deg, color-mix(in srgb, var(--tier-color, var(--c-common)) 18%, transparent), transparent 60%);
    pointer-events:none;
  }
  .reel-card .icon{ font-size:38px; line-height:1; }
  .reel-card .name{
    font-size:12.5px;
    font-weight:700;
    color:var(--text);
    line-height:1.3;
  }
  .reel-card.winner{
    border-top-color:var(--gold);
    box-shadow:0 0 0 1px var(--gold), 0 0 22px 2px rgba(217,166,46,0.55);
  }

  .reel-glow-edge{
    position:absolute; top:0; bottom:0; width:70px; z-index:4; pointer-events:none;
  }
  .reel-glow-edge.left{ left:0; background:linear-gradient(90deg, var(--bg-0), transparent); }
  .reel-glow-edge.right{ right:0; background:linear-gradient(270deg, var(--bg-0), transparent); }

  /* ---------- Controls ---------- */
  .controls{
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:16px;
    margin-top:26px;
  }

  .spin-btn{
    font-family:var(--font-body);
    font-weight:700;
    font-size:16px;
    color:var(--paper);
    background:linear-gradient(180deg, var(--vermillion-bright), var(--vermillion));
    border:none;
    padding:15px 44px;
    border-radius:3px;
    cursor:pointer;
    letter-spacing:0.01em;
    box-shadow:0 10px 24px -8px rgba(193,68,14,0.65), inset 0 1px 0 rgba(255,255,255,0.25);
    transition:transform 0.15s ease, box-shadow 0.15s ease;
  }
  .spin-btn:hover:not(:disabled){ transform:translateY(-1px); box-shadow:0 14px 28px -8px rgba(193,68,14,0.75), inset 0 1px 0 rgba(255,255,255,0.25); }
  .spin-btn:active:not(:disabled){ transform:translateY(1px) scale(0.99); }
  .spin-btn:disabled{ opacity:0.55; cursor:default; }
  .spin-btn:focus-visible{ outline:2px solid var(--gold); outline-offset:3px; }

  .odds-note{
    font-size:12.5px;
    color:var(--text-dim);
  }
  .odds-note button{
    background:none;border:none;color:var(--text-dim);text-decoration:underline;
    font-family:var(--font-body); font-size:12.5px; cursor:pointer; padding:0;
  }

  /* ---------- Result ---------- */
  .result{
    max-width:560px;
    margin:34px auto 0;
    background:var(--paper);
    color:var(--ink);
    border-radius:5px;
    padding:26px 28px;
    display:none;
    position:relative;
    box-shadow:0 24px 50px -18px rgba(0,0,0,0.55);
    border-top:4px solid var(--tier-color, var(--c-common));
    opacity:0;
    transform:translateY(10px);
  }
  .result.show{
    display:block;
    animation:resultIn 0.5s ease forwards;
  }
  @keyframes resultIn{
    from{opacity:0; transform:translateY(10px);}
    to{opacity:1; transform:translateY(0);}
  }
  .result .tier-tag{
    display:inline-block;
    font-size:11.5px;
    font-weight:700;
    color:#fff;
    background:var(--tier-color, var(--c-common));
    padding:4px 10px;
    border-radius:2px;
    margin-bottom:14px;
  }
  .result h2{
    font-family:var(--font-display);
    font-size:28px;
    margin:0 0 4px;
  }
  .result .jp{
    font-size:14px;
    color:#6b6250;
    margin:0 0 14px;
  }
  .result p.desc{
    font-size:14.5px;
    line-height:1.65;
    color:#4b4433;
    margin:0;
  }
  .result .icon-big{
    position:absolute;
    top:22px; right:26px;
    font-size:46px;
  }

  /* ---------- Menu list ---------- */
  .menu-section{
    margin-top:74px;
  }
  .menu-heading{
    display:flex;
    align-items:baseline;
    justify-content:space-between;
    margin-bottom:22px;
    flex-wrap:wrap;
    gap:8px;
    border-bottom:1px solid rgba(255,255,255,0.1);
    padding-bottom:14px;
  }
  .menu-heading h3{
    font-family:var(--font-display);
    font-size:22px;
    font-weight:700;
    margin:0;
  }
  .menu-heading p{
    margin:0;
    font-size:13px;
    color:var(--text-dim);
  }

  .tier-groups{
    display:flex;
    flex-direction:column;
    gap:22px;
  }
  .tier-group-title{
    display:flex;
    align-items:center;
    gap:10px;
    font-size:13.5px;
    font-weight:700;
    margin-bottom:10px;
  }
  .tier-dot{ width:9px;height:9px;border-radius:50%; background:var(--tier-color); }
  .tier-pct{ color:var(--text-dim); font-weight:400; }

  .food-grid{
    display:grid;
    grid-template-columns:repeat(auto-fill, minmax(148px, 1fr));
    gap:10px;
  }
  .food-card{
    background:var(--bg-2);
    border:1px solid rgba(255,255,255,0.06);
    border-left:3px solid var(--tier-color);
    border-radius:3px;
    padding:12px 12px;
    display:flex;
    align-items:center;
    gap:10px;
  }
  .food-card .icon{ font-size:22px; }
  .food-card .info .name{ font-size:13px; font-weight:700; line-height:1.3; }
  .food-card .info .jp{ font-size:11px; color:var(--text-dim); }

  footer{
    text-align:center;
    margin-top:60px;
    font-size:12.5px;
    color:var(--text-dim);
  }

  @media (max-width: 720px){
    .wrap{ padding:36px 16px 64px; }
    .reel-frame{ padding:16px; }
  }

  @media (max-width: 560px){
    .reel-card{ width:104px; }
    .reel-card .icon{ font-size:30px; }
    .reel-viewport{ height:150px; }
    .result{ padding:22px 20px; }
    .result .icon-big{ display:none; }
    .spin-btn{ width:100%; padding:15px 24px; }
    .food-grid{ grid-template-columns:repeat(auto-fill, minmax(128px, 1fr)); }
  }

  @media (max-width: 420px){
    .wrap{ padding:28px 14px 56px; }
    .eyebrow-line{ font-size:11.5px; gap:8px; }
    .eyebrow-line span.bar{ width:18px; }
    .reel-frame{ padding:10px; }
    .reel-card{ width:88px; padding:6px; }
    .reel-card .icon{ font-size:24px; }
    .reel-card .name{ font-size:10.5px; }
    .reel-viewport{ height:132px; }
    .food-grid{ grid-template-columns:repeat(auto-fill, minmax(112px, 1fr)); }
    .food-card{ padding:10px; gap:8px; }
    .menu-heading{ flex-direction:column; align-items:flex-start; }
  }

  @media (max-width: 340px){
    .reel-card{ width:76px; }
    .reel-viewport{ height:120px; }
  }

  @media (prefers-reduced-motion: reduce){
    .reel-track{ transition-duration:0.4s !important; }
    .result.show{ animation:none; opacity:1; transform:none; }
  }
</style>
</head>
<body>

<div class="wrap">

  <header>
    <div class="eyebrow-line"><span class="bar"></span>Vòng quay ẩm thực Nhật Bản<span class="bar"></span></div>
    <h1>Trưa nay ăn <em>gì</em>?</h1>
    <p>Hết ý tưởng cho bữa trưa? Quay một vòng, để món ăn đặc trưng Nhật Bản chọn giúp bạn.</p>
  </header>

  <div class="reel-block">
    <div class="reel-frame">
      <span class="corner tl"></span><span class="corner tr"></span>
      <span class="corner bl"></span><span class="corner br"></span>
      <div class="reel-viewport" id="reelViewport">
        <div class="marker"></div>
        <div class="reel-glow-edge left"></div>
        <div class="reel-glow-edge right"></div>
        <div class="reel-track" id="reelTrack"></div>
      </div>
    </div>

    <div class="controls">
      <button class="spin-btn" id="spinBtn">Quay ngay</button>
      <div class="odds-note"><button id="toggleOdds">Xem tỉ lệ trúng</button></div>
    </div>

    <div class="result" id="result" aria-live="polite">
      <span class="icon-big" id="resultIconBig"></span>
      <span class="tier-tag" id="resultTier"></span>
      <h2 id="resultName"></h2>
      <p class="jp" id="resultJp"></p>
      <p class="desc" id="resultDesc"></p>
    </div>
  </div>

  <div class="menu-section" id="menuSection">
    <div class="menu-heading">
      <h3>Toàn bộ thực đơn</h3>
      <p id="menuHint" style="display:none;">Tỉ lệ trúng theo từng cấp độ</p>
    </div>
    <div class="tier-groups" id="tierGroups"></div>
  </div>

  <footer>23 món trong vòng quay &middot; kết quả được chọn ngẫu nhiên mỗi lần quay</footer>

</div>

<script>
(function(){

  const TIERS = {
    common:    { label:"Thường",         color:"var(--c-common)",    weight:42 },
    uncommon:  { label:"Không phổ biến", color:"var(--c-uncommon)",  weight:28 },
    rare:      { label:"Hiếm",           color:"var(--c-rare)",      weight:18 },
    epic:      { label:"Cực hiếm",       color:"var(--c-epic)",      weight:9  },
    legendary: { label:"Huyền thoại",    color:"var(--c-legendary)", weight:3  },
  };

  const FOODS = [
    { name:"Cơm nắm rong biển", jp:"Onigiri", icon:"🍙", rarity:"common", desc:"Cơm vắt hình tam giác cuộn rong biển, tiện gọn cho bữa trưa nhanh mà vẫn no lâu." },
    { name:"Mì ramen", jp:"Ramen", icon:"🍜", rarity:"common", desc:"Sợi mì trong nước dùng đậm đà, món trưa quốc dân ở bất kỳ con phố nào của Nhật." },
    { name:"Cơm cà ri kiểu Nhật", jp:"Kare raisu", icon:"🍛", rarity:"common", desc:"Cà ri sánh mịn, ít cay, rưới lên cơm trắng — lựa chọn an toàn không bao giờ chán." },
    { name:"Mì udon nóng", jp:"Udon", icon:"🍲", rarity:"common", desc:"Sợi udon dày, dai, ăn trong nước dashi ấm nóng, dễ chịu cho những ngày se lạnh." },
    { name:"Soba lạnh chấm nước tương", jp:"Zaru soba", icon:"🥢", rarity:"common", desc:"Mì kiều mạch thanh mát, chấm cùng nước tsuyu — món trưa mùa hè được ưa chuộng." },
    { name:"Cơm hộp bento", jp:"Bento", icon:"🍱", rarity:"common", desc:"Hộp cơm nhiều ngăn với cơm, cá, rau củ — gọn gàng và cân bằng dinh dưỡng." },
    { name:"Cơm thịt bò xào", jp:"Gyudon", icon:"🍚", rarity:"common", desc:"Thịt bò thái mỏng xào cùng hành tây, rưới nước sốt ngọt mặn lên cơm nóng." },
    { name:"Cơm trứng cuộn kiểu Nhật", jp:"Omurice", icon:"🍳", rarity:"common", desc:"Cơm chiên bọc trong lớp trứng mềm mịn, rưới sốt cà chua ngọt dịu." },

    { name:"Cốt lết heo chiên xù", jp:"Tonkatsu", icon:"🍖", rarity:"uncommon", desc:"Miếng thịt heo tẩm bột chiên giòn rụm, ăn kèm bắp cải bào và sốt tonkatsu." },
    { name:"Gà chiên kiểu Nhật", jp:"Karaage", icon:"🍗", rarity:"uncommon", desc:"Gà ướp gia vị rồi chiên giòn bên ngoài, mọng nước bên trong — món khoái khẩu mọi lứa tuổi." },
    { name:"Mì xào kiểu Nhật", jp:"Yakisoba", icon:"🍝", rarity:"uncommon", desc:"Mì xào cùng thịt và rau củ, phủ sốt yakisoba đậm đà, rắc thêm rong biển bào." },
    { name:"Cơm cốt lết trứng", jp:"Katsudon", icon:"🍚", rarity:"uncommon", desc:"Cốt lết chiên giòn nấu cùng trứng và hành, đặt lên cơm nóng hổi." },
    { name:"Udon tempura", jp:"Tempura udon", icon:"🍤", rarity:"uncommon", desc:"Udon nước dùng thanh, điểm xuyết tôm tempura giòn tan ngâm trong nước lèo." },
    { name:"Cơm gà trứng", jp:"Oyakodon", icon:"🐔", rarity:"uncommon", desc:"Thịt gà và trứng nấu cùng trong nước sốt dashi ngọt nhẹ, đổ lên cơm trắng." },

    { name:"Sushi băng chuyền", jp:"Kaiten-zushi", icon:"🍣", rarity:"rare", desc:"Từng đĩa sushi tươi trôi qua trước mặt bạn — vừa ăn vừa chọn theo sở thích." },
    { name:"Cơm lươn nướng", jp:"Unadon", icon:"🐟", rarity:"rare", desc:"Lươn nướng phết sốt tare ngọt mặn, đặt trên lớp cơm dẻo — món bổ dưỡng mùa hè." },
    { name:"Lẩu shabu-shabu mini", jp:"Shabu-shabu", icon:"🍲", rarity:"rare", desc:"Thịt bò thái mỏng nhúng qua nước dùng nóng, chấm cùng nước sốt mè hoặc ponzu." },
    { name:"Cơm cá sống thập cẩm", jp:"Chirashi don", icon:"🍣", rarity:"rare", desc:"Nhiều loại sashimi tươi bày đẹp mắt trên nền cơm giấm — bữa trưa sang trọng." },

    { name:"Set bò Wagyu trưa", jp:"Wagyu lunch set", icon:"🥩", rarity:"epic", desc:"Thịt bò Wagyu vân mỡ mềm tan, thường chỉ có trong thực đơn trưa giá ưu đãi hiếm hoi." },
    { name:"Omakase thu nhỏ buổi trưa", jp:"Omakase mini", icon:"🍱", rarity:"epic", desc:"Đầu bếp chọn món theo mùa, phiên bản trưa rút gọn của bữa omakase đầy đủ." },
    { name:"Ẩm thực Kaiseki buổi trưa", jp:"Kaiseki lunch", icon:"🎎", rarity:"epic", desc:"Chuỗi món nhỏ tinh tế theo truyền thống cung đình, trình bày tỉ mỉ theo mùa." },

    { name:"Sushi Omakase cao cấp", jp:"Sushi Omakase", icon:"👑", rarity:"legendary", desc:"Trải nghiệm sushi đỉnh cao do nghệ nhân trực tiếp chế biến từng miếng — hiếm khi xuất hiện trong bữa trưa thường ngày." },
    { name:"Set cá nóc đặc biệt", jp:"Fugu set", icon:"🐡", rarity:"legendary", desc:"Cá nóc được chế biến bởi đầu bếp có chứng chỉ riêng — món ăn hiếm và đầy thử thách." },
  ];

  const rarityRank = ["common","uncommon","rare","epic","legendary"];

  // ---- weighted pick ----
  function pickWeightedFood(){
    const totalWeight = FOODS.reduce((sum,f)=> sum + TIERS[f.rarity].weight, 0);
    let r = Math.random() * totalWeight;
    for(const f of FOODS){
      r -= TIERS[f.rarity].weight;
      if(r <= 0) return f;
    }
    return FOODS[FOODS.length-1];
  }

  function pickRandomFood(){
    return FOODS[Math.floor(Math.random()*FOODS.length)];
  }

  // ---- build menu list grouped by tier ----
  const tierGroupsEl = document.getElementById('tierGroups');
  rarityRank.forEach(key=>{
    const tier = TIERS[key];
    const items = FOODS.filter(f=>f.rarity===key);
    const group = document.createElement('div');
    group.innerHTML = `
      <div class="tier-group-title" style="color:${tier.color}">
        <span class="tier-dot" style="background:${tier.color}"></span>
        ${tier.label} <span class="tier-pct">— ${tier.weight}% mỗi lượt</span>
      </div>
      <div class="food-grid">
        ${items.map(f=>`
          <div class="food-card" style="--tier-color:${tier.color}">
            <span class="icon">${f.icon}</span>
            <div class="info">
              <div class="name">${f.name}</div>
              <div class="jp">${f.jp}</div>
            </div>
          </div>
        `).join('')}
      </div>
    `;
    tierGroupsEl.appendChild(group);
  });

  document.getElementById('toggleOdds').addEventListener('click', ()=>{
    const section = document.getElementById('menuSection');
    section.scrollIntoView({behavior:'smooth', block:'start'});
  });

  // ---- reel ----
  const track = document.getElementById('reelTrack');
  const viewport = document.getElementById('reelViewport');
  const spinBtn = document.getElementById('spinBtn');
  const resultEl = document.getElementById('result');

  const REEL_LENGTH = 46;
  const WINNER_INDEX = 38;

  function renderCard(food, isWinner){
    const tier = TIERS[food.rarity];
    const div = document.createElement('div');
    div.className = 'reel-card' + (isWinner ? ' winner' : '');
    div.style.setProperty('--tier-color', tier.color);
    div.innerHTML = `<span class="icon">${food.icon}</span><span class="name">${food.name}</span>`;
    return div;
  }

  function buildReel(winnerFood){
    track.innerHTML = '';
    track.style.transition = 'none';
    track.style.transform = 'translateX(0px)';
    for(let i=0;i<REEL_LENGTH;i++){
      const food = (i === WINNER_INDEX) ? winnerFood : pickRandomFood();
      track.appendChild(renderCard(food, i === WINNER_INDEX));
    }
  }

  // Measure the actual rendered card width + gap from the DOM instead of
  // hardcoding pixel values, so the math stays correct at every breakpoint
  // (the CSS shrinks cards on narrow screens) and after font/zoom changes.
  function getStepMetrics(){
    const card = track.querySelector('.reel-card');
    const trackStyle = getComputedStyle(track);
    const gap = parseFloat(trackStyle.columnGap || trackStyle.gap) || 12;
    const cardWidth = card ? card.getBoundingClientRect().width : 132;
    return { cardWidth, step: cardWidth + gap };
  }

  const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  let spinning = false;
  let currentJitter = 0;

  function computeX(jitter){
    const { cardWidth, step } = getStepMetrics();
    const viewportWidth = viewport.clientWidth;
    const targetCenter = WINNER_INDEX * step + cardWidth/2;
    return targetCenter - (viewportWidth/2) + jitter;
  }

  // Keep the landed (or idle) card centered under the marker if the
  // viewport is resized or rotated while nothing is spinning.
  function reposition(){
    if(spinning) return;
    track.style.transition = 'none';
    track.style.transform = `translateX(${-computeX(currentJitter)}px)`;
  }

  function debounce(fn, wait){
    let t;
    return (...args)=>{ clearTimeout(t); t = setTimeout(()=>fn(...args), wait); };
  }

  function spin(){
    if(spinning) return;
    spinning = true;
    spinBtn.disabled = true;
    resultEl.classList.remove('show');

    const winner = pickWeightedFood();
    buildReel(winner);

    // force reflow so the reset transform applies before animating
    void track.offsetWidth;

    currentJitter = (Math.random() * 40) - 20; // +-20px within the card
    const x = computeX(currentJitter);

    const duration = reduceMotion ? 0.4 : 5.2;
    track.classList.add('blurring');
    track.style.transition = `transform ${duration}s cubic-bezier(0.11, 0.82, 0.14, 1)`;
    track.style.transform = `translateX(${-x}px)`;

    setTimeout(()=>{
      track.classList.remove('blurring');
    }, duration * 1000 * 0.7);

    setTimeout(()=>{
      showResult(winner);
      spinning = false;
      spinBtn.disabled = false;
    }, duration * 1000 + 120);
  }

  function showResult(food){
    const tier = TIERS[food.rarity];
    resultEl.style.setProperty('--tier-color', tier.color);
    document.getElementById('resultTier').textContent = tier.label;
    document.getElementById('resultTier').style.background = tier.color;
    document.getElementById('resultName').textContent = food.name;
    document.getElementById('resultJp').textContent = food.jp;
    document.getElementById('resultDesc').textContent = food.desc;
    document.getElementById('resultIconBig').textContent = food.icon;
    resultEl.classList.add('show');
    resultEl.scrollIntoView({behavior:'smooth', block:'center'});
  }

  // initial idle reel (static, non-winning) so page doesn't look empty
  buildReel(pickRandomFood());
  reposition();

  spinBtn.addEventListener('click', spin);

  window.addEventListener('resize', debounce(reposition, 150));
  window.addEventListener('orientationchange', ()=> setTimeout(reposition, 200));

})();
</script>

</body>
</html>
